name: Refresh publications
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publications
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve ORCID records and update publications and news
        run: python scripts/sync_publications.py
      - name: Commit updated content
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html publications.html data/publication-cache.json data/publications.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh publications and publication news from ORCID'
            git push
          fi
